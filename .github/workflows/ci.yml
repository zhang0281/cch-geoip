name: Test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: make smoke
      - run: test -z "$(gofmt -l cmd internal tools)"
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/cch-geoip
      - run: docker build -t cch-geoip:local .
      - run: make docker-smoke
