name: Publish Docker Hub
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, e.g. 0.2.0 (no v prefix)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate publish configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || exit 1
          test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/cch-geoip:${{ inputs.version }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/cch-geoip:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
